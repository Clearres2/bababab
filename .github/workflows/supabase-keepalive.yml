name: Keep Supabase Alive

on:
  schedule:

    - cron: '0 12 * * *'
  

  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase REST API
        run: |
          echo "Pinging Supabase project: ${{ secrets.SUPABASE_PROJECT_ID }}"
          
          # Отправляем GET запрос к базовому эндпоинту
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            "https://${{ secrets.SUPABASE_PROJECT_ID }}.supabase.co/rest/v1/")
          
          echo "HTTP Status Code: $RESPONSE"
          
          # Проверка: если статус не 200 и не 401 (Unauthorized, но сервер живой), то ошибка
          if [ "$RESPONSE" -ne 200 ] && [ "$RESPONSE" -ne 401 ]; then
            echo "❌ Failed to ping Supabase. Status: $RESPONSE"
            exit 1
          else
            echo "✅ Supabase is awake!"
          fi
