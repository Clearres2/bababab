name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 */12 * * *'  
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase (real query)
        run: |
          echo "Pinging Supabase project: ${{ secrets.SUPABASE_PROJECT_ID }}"
          
          RESPONSE=$(curl -s -w "%{http_code}" -o /tmp/supabase_response.json \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            "https://${{ secrets.SUPABASE_PROJECT_ID }}.supabase.co/rest/v1/users?select=count&limit=1")
          
          echo "HTTP Status Code: $RESPONSE"
          echo "Response body:"
          cat /tmp/supabase_response.json
          
          if [ "$RESPONSE" = "200" ] || [ "$RESPONSE" = "406" ]; then
            echo "✅ Supabase is awake! (status: $RESPONSE)"
          else
            echo "❌ Failed to ping Supabase. Status: $RESPONSE"
            exit 1
          fi
